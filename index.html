<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日語隨身通">
  <title>日語隨身通 Nihongo Go — 零基礎開口對話到 JLPT N1</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Top Sticky App Bar -->
    <header class="top-bar">
      <div class="brand" onclick="switchTab('home')" style="cursor:pointer">
        <div class="brand-logo">あ</div>
        <div>
          <div class="brand-title">日語隨身通 <span style="font-size:0.75rem;color:#fb7185;font-weight:700">Zero➔N1</span></div>
          <div class="brand-sub">零基礎開口對話 & JLPT 隨身教練</div>
        </div>
      </div>
      <div class="stats-pills">
        <div class="stat-pill streak" title="連續學習天數">🔥 <span id="headerStreak">1</span> 天</div>
        <div class="stat-pill xp" title="累計學習經驗值">⚡ <span id="headerXP">0</span> XP</div>
      </div>
    </header>

    <!-- Main Views -->
    <main class="view-container">
      <section id="view-home" class="view-section active"></section>
      <section id="view-kana" class="view-section"></section>
      <section id="view-conv" class="view-section"></section>
      <section id="view-cards" class="view-section"></section>
      <section id="view-quiz" class="view-section"></section>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
          <span class="nav-icon">🗺️</span>
          <span>學習藍圖</span>
        </button>
        <button class="nav-item" data-tab="kana" onclick="switchTab('kana')">
          <span class="nav-icon">🔤</span>
          <span>五十音</span>
        </button>
        <button class="nav-item" data-tab="conv" onclick="switchTab('conv')">
          <span class="nav-icon">💬</span>
          <span>開口對話</span>
        </button>
        <button class="nav-item" data-tab="cards" onclick="switchTab('cards')">
          <span class="nav-icon">🗂️</span>
          <span>N5~N1閃卡</span>
        </button>
        <button class="nav-item" data-tab="quiz" onclick="switchTab('quiz')">
          <span class="nav-icon">🏆</span>
          <span>闖關測驗</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Kana Detail Modal -->
  <div id="kanaModal" class="modal-backdrop" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-card" id="kanaModalContent"></div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
